services:
  api: 
    build: .
    container_name: fastapi-qdrant
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333"
    # volumes:
    #   - qdrant_storage:/qdrant/storage
    restart: unless-stopped
